<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- Radzen CSS -->
    <link rel="stylesheet" href="/_content/Radzen.Blazor/css/default-base.css">
    <!-- Radzen JavaScript (IMPORTANTE PARA POPUPS Y DROPDOWNS) -->
    <script src="/_content/Radzen.Blazor/Radzen.Blazor.js"></script>


    <!-- Librería para iconos de Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">




    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equinoterapia</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="FRONTproyectoEquinoterapia.styles.css" rel="stylesheet" />

</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        window.blazorDownloadFile = (fileName, base64Data) => {
            const link = document.createElement('a');
            link.href = "data:application/octet-stream;base64," + base64Data;
            link.download = fileName;
            link.click();
        };
    </script>

    <script src="js/funciones.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>


    <script>
        window.focusElement = (el) => {
            try {
                if (el) {
                    // ElementReference llega como objeto, focusará correctamente
                    el.focus();
                }
            } catch (e) {
                console.warn("focusElement error:", e);
            }
        };
    </script>




</body>

</html>
